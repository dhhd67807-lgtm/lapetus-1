name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.199)'
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            artifact: lapetus-linux-x64.tar.gz
          - os: ubuntu-latest
            target: linux-arm64
            artifact: lapetus-linux-arm64.tar.gz
          - os: macos-latest
            target: darwin-arm64
            artifact: lapetus-darwin-arm64.zip
          - os: macos-13
            target: darwin-x64
            artifact: lapetus-darwin-x64.zip
          - os: windows-latest
            target: windows-x64
            artifact: lapetus-windows-x64.zip

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          cd packages/opencode
          bun build ./src/index.ts --compile --outfile lapetus
        
      - name: Package (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          cd packages/opencode
          tar -czvf ${{ matrix.artifact }} lapetus
          
      - name: Package (macOS/Windows)
        if: "!startsWith(matrix.target, 'linux')"
        run: |
          cd packages/opencode
          zip ${{ matrix.artifact }} lapetus${{ matrix.os == 'windows-latest' && '.exe' || '' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: packages/opencode/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
