name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.199)'
        required: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
          - os: ubuntu-latest
            target: linux-arm64
          - os: macos-latest
            target: darwin-arm64
          - os: macos-15-large
            target: darwin-x64
          - os: windows-latest
            target: windows-x64

    runs-on: ${{ matrix.os }}
    
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install dependencies
        run: bun install

      - name: Build binary
        run: |
          cd packages/opencode
          bun run build --single
        
      - name: Rename and package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd packages/opencode/dist
          for dir in lapetus-linux-*; do
            if [ -d "$dir" ]; then
              mv "$dir/bin/opencode" "$dir/bin/lapetus" 2>/dev/null || true
              tar -czvf "${dir}.tar.gz" -C "$dir/bin" lapetus
            fi
          done
          
      - name: Rename and package (macOS)
        if: runner.os == 'macOS'
        run: |
          cd packages/opencode/dist
          for dir in lapetus-darwin-*; do
            if [ -d "$dir" ]; then
              mv "$dir/bin/opencode" "$dir/bin/lapetus" 2>/dev/null || true
              zip -j "${dir}.zip" "$dir/bin/lapetus"
            fi
          done

      - name: Rename and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd packages/opencode/dist
          Get-ChildItem -Directory -Filter "lapetus-windows-*" | ForEach-Object {
            $dir = $_.Name
            if (Test-Path "$dir/bin/opencode.exe") {
              Rename-Item "$dir/bin/opencode.exe" "lapetus.exe"
            }
            Compress-Archive -Path "$dir/bin/lapetus.exe" -DestinationPath "$dir.zip"
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            packages/opencode/dist/*.tar.gz
            packages/opencode/dist/*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: List artifacts
        run: find artifacts -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: artifacts/**/*
          generate_release_notes: true
